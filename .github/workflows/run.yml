name: Run Cardio News Agent
on:
  schedule:
    - cron: '0 6 * * *'   # ~7:00 Italia (inverno); ~8:00 in estate per via dell'ora legale
  workflow_dispatch:

jobs:
  run-cardio-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install required libraries
        run: pip install requests

      - name: Execute PubMed and Groq Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ./cardio_agent.py

      - name: Notifica fallimento
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Cardio agent fallito, controlla i log su GitHub Actions"
