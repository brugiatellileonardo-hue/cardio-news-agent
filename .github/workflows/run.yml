on:
  schedule:
    - cron: "0 5 * * *"     # giornaliero (tieni il tuo orario)
    - cron: "0 17 * * 0"    # digest domenica
  workflow_dispatch:

permissions:
  contents: write

# step di esecuzione:
      - run: |
          if [ "${{ github.event.schedule }}" = "0 17 * * 0" ]; then
            python cardio_agent.py --digest
          else
            python cardio_agent.py
          fi
# step di commit dello stato: aggiungi il nuovo file
      - run: |
          git add sent_pmids.json digest_queue.json
          git diff --staged --quiet || git commit -m "update state"
          git push
