name: Cardio Agent

on:
  schedule:
    - cron: "0 5 * * *"     # giornaliero, 05:00 UTC (07:00 ora italiana legale)
    - cron: "0 17 * * 0"    # digest, domenica 17:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità del run manuale"
        type: choice
        options: [daily, digest]
        default: daily

permissions:
  contents: write

concurrency:
  group: cardio-agent       # evita due run in parallelo che committano lo stato
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 17 * * 0" ] || [ "${{ inputs.mode }}" = "digest" ]; then
            python cardio_agent.py --digest
          else
            python cardio_agent.py
          fi

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add sent_pmids.json digest_queue.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "update state [skip ci]"
          git pull --rebase
          git push
